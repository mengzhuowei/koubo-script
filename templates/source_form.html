{% extends "base.html" %}
{% block title %}{% if source %}编辑来源{% else %}新增来源{% endif %} · AI效率教练{% endblock %}
{% block content %}
<h1 class="page-title">{% if source %}编辑来源{% else %}新增来源{% endif %}</h1>

<form class="form" method="post" action="{% if source %}/sources/{{ source.id }}{% else %}/sources{% endif %}">
  <div class="form-row">
    <label>名称</label>
    <input type="text" name="name" value="{{ source.name if source else '' }}" required>
  </div>
  <div class="form-row">
    <label>URL</label>
    <input type="text" name="url" value="{{ source.url if source else '' }}" placeholder="https://..." required>
  </div>
  <div class="form-row">
    <label>类型</label>
    <select name="type">
      {% set t = source.type if source else 'rss' %}
      <option value="rss" {% if t == 'rss' %}selected{% endif %}>rss（RSS 订阅）</option>
      <option value="webpage" {% if t == 'webpage' %}selected{% endif %}>webpage（普通网页）</option>
      <option value="manual" {% if t == 'manual' %}selected{% endif %}>manual（手动录入）</option>
    </select>
  </div>
  <div class="form-row">
    <label>层级</label>
    <select name="level">
      {% set lv = source.level if source else 'B' %}
      <option value="S" {% if lv == 'S' %}selected{% endif %}>S（官方源）</option>
      <option value="A" {% if lv == 'A' %}selected{% endif %}>A（框架源）</option>
      <option value="B" {% if lv == 'B' %}selected{% endif %}>B（研究/开发者社区）</option>
      <option value="C" {% if lv == 'C' %}selected{% endif %}>C（中文传播源）</option>
    </select>
  </div>
  <div class="form-row">
    <label>关键词（逗号分隔，用于命中判断）</label>
    <input type="text" name="keywords" value="{{ source.keywords if source else '' }}" placeholder="AI Agent,MCP,智能体">
  </div>
  <div class="form-row">
    <label>启用</label>
    <select name="enabled">
      {% set en = source.enabled if source else 1 %}
      <option value="1" {% if en %}selected{% endif %}>启用</option>
      <option value="0" {% if not en %}selected{% endif %}>停用</option>
    </select>
  </div>
  <div class="form-inline">
    <button class="btn btn-primary" type="submit">保存</button>
    <a class="btn" href="/sources">取消</a>
  </div>
</form>
{% endblock %}
