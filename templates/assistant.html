{% extends "base.html" %}
{% block title %}项目助手 · 口播雷达{% endblock %}
{% block content %}
<section class="project-chat" aria-labelledby="assistant-title">
  <header class="project-chat-header">
    <div>
      <h1 id="assistant-title">项目助手</h1>
      <p>用对话查选题、生成脚本和跟进任务。</p>
    </div>
    <button type="button" class="btn" id="assistant-reset" disabled>新对话</button>
  </header>

  <div class="panel project-chat-panel">
    <div class="project-chat-conversation" id="assistant-conversation">
      <div class="project-chat-examples" id="assistant-examples">
        <button type="button" class="btn" data-message="列出今天得分最高的 3 个选题">今天有哪些高分选题？</button>
        <button type="button" class="btn" data-message="查一下最近失败的任务">最近有任务失败吗？</button>
        <button type="button" class="btn" data-message="生成今日选题">生成今日选题</button>
      </div>
      <div id="assistant-messages" role="log" aria-label="对话消息"></div>
    </div>
    <form class="project-chat-form" id="assistant-form">
      <label for="assistant-input">消息</label>
      <ul class="project-chat-attachments" id="assistant-attachments" aria-label="待发送附件" hidden></ul>
      <div class="project-chat-composer">
        <button type="button" class="btn project-chat-attach" id="assistant-attach" aria-label="上传文件" title="上传文件">＋</button>
        <input type="file" id="assistant-files" accept="{{ attachment_types }}" multiple hidden
               data-max-bytes="{{ max_attachment_bytes }}" data-max-files="{{ max_attachments }}">
        <textarea id="assistant-input" rows="2" maxlength="2000" placeholder="输入消息" aria-describedby="assistant-suggestion"></textarea>
        <button class="btn btn-primary" id="assistant-send" type="submit">发送</button>
      </div>
      <button type="button" class="project-chat-suggestion" id="assistant-suggestion" hidden>
        <span id="assistant-suggestion-text"></span><kbd>Tab</kbd>
      </button>
      <p class="project-chat-status" id="assistant-status" role="status" hidden></p>
    </form>
  </div>
</section>
<script src="/static/assistant.js?v=3" defer></script>
{% endblock %}
