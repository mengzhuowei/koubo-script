{% extends "base.html" %}
{% block title %}任务 · 口播雷达{% endblock %}
{% block content %}
<div class="panel-head" style="border:none">
  <h1 class="page-title" style="margin:0">任务列表</h1>
  <a class="btn" href="/jobs">刷新</a>
</div>
<div class="muted" style="margin-bottom:12px">
  页面每 4 秒自动刷新任务表格。
  <label style="margin-left:12px;cursor:pointer">
    <input type="checkbox" id="auto-refresh-toggle" checked> 自动刷新
  </label>
</div>

<section class="panel" id="jobs-table-wrap">
  {% include "jobs_table.html" %}
</section>

<script>
(function () {
  var INTERVAL = 4000;
  var timer = null;
  var wrap = document.getElementById('jobs-table-wrap');
  var toggle = document.getElementById('auto-refresh-toggle');

  function refresh() {
    fetch('/jobs?partial=1', {headers: {'X-Requested-With': 'XMLHttpRequest'}})
      .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
      .then(function (html) { wrap.innerHTML = html; })
      .catch(function () { /* 网络抖动忽略，下次重试 */ });
  }

  function start() {
    if (timer) return;
    timer = setInterval(refresh, INTERVAL);
  }
  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
  }

  toggle.addEventListener('change', function () {
    if (toggle.checked) start(); else stop();
  });
  start();
})();
</script>
{% endblock %}
