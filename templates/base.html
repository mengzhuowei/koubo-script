<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}口播雷达工作台{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">口播雷达 · 选题脚本工作台</div>
    <nav class="nav">
      <a href="/" class="nav-link {% if active == 'dashboard' %}active{% endif %}">首页</a>
      <a href="/sources" class="nav-link {% if active == 'sources' %}active{% endif %}">来源库</a>
      <a href="/articles" class="nav-link {% if active == 'articles' %}active{% endif %}">文章池</a>
      <a href="/topics" class="nav-link {% if active == 'topics' %}active{% endif %}">选题库</a>
      <a href="/jobs" class="nav-link {% if active == 'jobs' %}active{% endif %}">任务</a>
      <a href="/settings" class="nav-link {% if active == 'settings' %}active{% endif %}">设置</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
